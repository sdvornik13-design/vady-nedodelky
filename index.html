<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V+N BD Jordánská III</title>
<style>
:root{--blue:#1E6EB2;--blue2:#2a82cc;--bg:#0f1720;--card:#18222e;--card2:#1f2b39;--line:#2a394b;--text:#e8eef5;--muted:#91a3b7;
--red:#e5484d;--orange:#f0a020;--green:#30a46c;--purple:#9b7be0;--gray:#6b7a8c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--blue);padding:10px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0006}
.hrow{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto}
.logo{background:#fff;border-radius:8px;padding:4px 8px;display:flex;align-items:center;flex:none}
.logo img{height:28px;width:auto;display:block}
h1{font-size:17px;margin:0;flex:1}
.pv{position:fixed;inset:0;z-index:50;background:#000;touch-action:pinch-zoom}
.pvbox{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch}
.pvbox img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.pvbox.z{display:block}.pvbox.z img{max-width:none;max-height:none;width:300%;cursor:zoom-out}
.pvx,.pvn{position:absolute;border:0;background:#0009;color:#fff;border-radius:50%;width:44px;height:44px;font-size:28px;line-height:1;cursor:pointer}
.pvx{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
.pvn{top:50%;margin-top:-22px}.pvp{left:calc(8px + env(safe-area-inset-left,0px))}.pvnx{right:calc(8px + env(safe-area-inset-right,0px))}
.pvc,.pvh{position:absolute;left:50%;transform:translateX(-50%);color:#fff;background:#0009;padding:4px 10px;border-radius:12px;font-size:13px}
.pvc{top:calc(18px + env(safe-area-inset-top,0px))}.pvh{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.photo{cursor:zoom-in}
.ph{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.pt{position:relative}.pt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.pt button{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:16px;line-height:1;cursor:pointer}
.phb{display:flex;gap:8px;margin-top:10px}
.who:empty{display:none}
.tel{color:var(--blue2);font-weight:700;text-decoration:none;white-space:nowrap}
.updbar{display:block;width:100%;border:0;background:#30a46c;color:#fff;font:700 14px system-ui,sans-serif;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));cursor:pointer;text-align:center}
.rfb{background:#ffffff26;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;flex:none}
.rfb.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.rfb.spin{animation:none;opacity:.5}}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1 0 auto;min-width:52px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 8px;font:600 14px system-ui,sans-serif}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.planbox{position:relative;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px;max-height:70vh;-webkit-overflow-scrolling:touch}
.planbox .inner{position:relative;width:100%}.planbox.zoom .inner{width:300%}
.planbox img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.pin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -13px;pointer-events:none}
.pin:before{content:'';position:absolute;inset:0;background:#e5484d;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 1px 4px #0008}
.planbar{display:flex;gap:8px;margin-top:6px;align-items:center}.planbar .small{flex:1}
.who{font-size:12px;background:#ffffff26;padding:3px 8px;border-radius:12px;white-space:nowrap;cursor:pointer}
nav{display:flex;gap:6px;max-width:900px;margin:8px auto 0}
nav button{flex:1;background:#ffffff1f;border:0;color:#fff;padding:8px;border-radius:8px;font-weight:600;font-size:14px}
nav button.on{background:#fff;color:var(--blue)}
main{max-width:900px;margin:0 auto;padding:12px 16px 80px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--text);padding:6px 11px;border-radius:16px;font-size:13px}
.chip.on{background:var(--blue);border-color:var(--blue)}
.chip b{margin-left:4px;opacity:.8}
.bar{display:flex;gap:8px;margin-bottom:10px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font:inherit}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;cursor:pointer}
.card:active{background:var(--card2)}
.card .body{flex:1;min-width:0}
.card .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card .desc{margin:4px 0;word-wrap:break-word}
.card .meta{font-size:12px;color:var(--muted)}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--card2)}
.b{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;color:#fff}
.pA{background:var(--red)}.pB{background:var(--orange);color:#1a1a1a}.pC{background:var(--gray)}
.sNová{background:var(--blue2)}.sVráceno{background:var(--purple)}.sVyřešeno{background:var(--orange);color:#1a1a1a}.sUzavřeno{background:var(--green)}
.late{color:var(--red)!important;font-weight:700}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font:600 15px system-ui,sans-serif;color:#fff;background:var(--blue);cursor:pointer}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.o{background:var(--purple)}.btn.sec{background:var(--card2);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.btn.full{width:100%;margin-top:14px}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.rowb .btn{flex:1}
.prio{display:flex;gap:6px}.prio label{flex:1;margin:0;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 4px;text-align:center;color:var(--text);font-size:13px;cursor:pointer}
.prio input{display:none}.prio input:checked+span{font-weight:800}
.prio label:has(input:checked){border-color:var(--blue2);background:#1E6EB233}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:none;overflow-y:auto;padding:16px}
.ov.on{display:block}
.modal{background:var(--card);border-radius:14px;max-width:640px;margin:0 auto;padding:16px;border:1px solid var(--line)}
.modal h2{margin:0 0 4px;font-size:18px;display:flex;justify-content:space-between;gap:10px}
.x{background:none;border:0;color:var(--muted);font-size:26px;line-height:1;cursor:pointer}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;margin:10px 0}
.kv div:nth-child(odd){color:var(--muted)}
.photo{width:100%;border-radius:10px;margin-top:6px;background:var(--card2)}
.hist{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.hist div{margin:3px 0}
.note{background:var(--card2);border-left:3px solid var(--blue2);padding:8px 10px;border-radius:6px;font-size:14px;margin-top:8px}
.firm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.firm .n{font-weight:700}.firm .m{font-size:12px;color:var(--muted);word-break:break-all}
.small{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:10px;z-index:30;display:none;font-weight:600;max-width:90%}
.load{position:fixed;inset:0;background:#0008;z-index:40;display:none;align-items:center;justify-content:center;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;color:var(--text);font:inherit;cursor:pointer}
.stat.on{background:#1E6EB233;border-color:var(--blue2);box-shadow:inset 0 -3px 0 var(--blue2)}
.stat:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
@media(max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>

const S = {role:null, vady:[], firmy:[], tab:'list', filtr:'open', firma:'', q:'', firmaJm:null};

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null}}
const qs = new URLSearchParams(location.search);
let KEY = qs.get('k'), FT = qs.get('f');
if (KEY) { ls('vn_k',KEY); ls('vn_f',null); } else if (FT) { ls('vn_f',FT); ls('vn_k',null); }
else { KEY = ls('vn_k'); FT = ls('vn_f'); }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd = ts => ts ? new Date(ts).toLocaleDateString('cs-CZ') : '—';
const fdt = ts => ts ? new Date(ts).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const day0 = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const today = () => day0(Date.now());
const isOpen = v => v.stav === 'Nová' || v.stav === 'Vráceno';
const isLate = v => isOpen(v) && v.termin && day0(v.termin) < today();
const firmName = id => id ? ((S.firmy.find(f => f.id === id) || {}).nazev || '—') : 'Neurčeno';
const thumb = id => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1000`;
const toDateInput = ts => { const d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fromDateInput = s => { if(!s) return 0; const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d,12).getTime(); };
const plusDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return toDateInput(d.getTime()); };

function toast(t){ const el=$('#toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display='none',3000); }
function busy(on, t){ const el=$('#load'); el.textContent=t||'Ukládám…'; el.style.display=on?'flex':'none'; }

async function api(action, extra){
  const body = Object.assign({action}, extra||{});
  if (KEY) body.k = KEY; if (FT) body.f = FT;
  const jm = ls('vn_jmeno'); if (KEY && jm) body.jmeno = jm;
  const r = await fetch(API_URL, {method:'POST', body: JSON.stringify(body)});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Chyba serveru');
  return j;
}

/* výběr více fotek (max. 4): fotoaparát nebo galerie */
const fotos = s => String(s || '').split('|').filter(Boolean);
function photoPicker(el, title){
  const P = {files: []};
  const draw = () => {
    el.innerHTML = (P.files.length ? `<div class="ph">${P.files.map((f,i) => `<div class="pt"><img src="${URL.createObjectURL(f)}" alt="Fotka ${i+1}"><button type="button" data-i="${i}" aria-label="Odebrat fotku">×</button></div>`).join('')}</div>` : '') +
      (P.files.length < 4 ? `<div class="phb"><label class="btn sec" style="flex:1;text-align:center;color:var(--text);font-size:16px">📷 ${P.files.length ? 'Další fotka ('+P.files.length+'/4)' : title}<input type="file" accept="image/*" capture="environment" style="display:none"></label>
        <label class="btn sec" style="flex:none;color:var(--text)">🖼 Galerie<input type="file" accept="image/*" multiple style="display:none"></label></div>` : '<div class="small" style="margin-top:6px">Maximálně 4 fotky</div>');
    el.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = () => { P.files = P.files.concat([...inp.files]).slice(0, 4); draw(); });
    el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { P.files.splice(+b.dataset.i, 1); draw(); });
  };
  draw(); return P;
}
async function resizeAll(files){ const out = []; for (const f of files) out.push(await resizePhoto(f)); return out; }
function photoGallery(s){ const l = fotos(s); return l.map((id,i) => `<img class="photo" src="${thumb(id)}" alt="Fotka ${i+1} – ťukni pro zvětšení" data-ph="${esc(l.join('|'))}" data-i="${i}">`).join(''); }

/* prohlížeč fotek přes celou obrazovku: ťuk = zvětšit 3×, šipky = další fotka */
const big = id => String(id).startsWith('data:') ? id : `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w2000`;
function openViewer(list, idx){
  let i = idx, zoom = false;
  let pv = document.getElementById('pv');
  if (!pv) { pv = document.createElement('div'); pv.id = 'pv'; pv.className = 'pv'; document.body.appendChild(pv); }
  const draw = (cx, cy) => {
    pv.innerHTML = `<div class="pvbox${zoom ? ' z' : ''}" id="pvb"><img src="${big(list[i])}" alt="Fotka ${i+1}" draggable="false"></div>
      <button class="pvx" type="button" aria-label="Zavřít">×</button>
      ${list.length > 1 ? `<button class="pvn pvp" type="button" aria-label="Předchozí">‹</button><button class="pvn pvnx" type="button" aria-label="Další">›</button><div class="pvc">${i+1} / ${list.length}</div>` : ''}
      <div class="pvh">${zoom ? 'Ťukni pro zmenšení' : 'Ťukni pro zvětšení'}</div>`;
    const box = pv.querySelector('#pvb'), img = box.querySelector('img');
    if (zoom && cx !== undefined) img.onload = () => { box.scrollLeft = cx * box.scrollWidth - box.clientWidth/2; box.scrollTop = cy * box.scrollHeight - box.clientHeight/2; };
    img.onclick = ev => { const r = img.getBoundingClientRect(); const x = (ev.clientX - r.left)/r.width, y = (ev.clientY - r.top)/r.height; zoom = !zoom; draw(x, y);
      if (zoom) { const b = pv.querySelector('#pvb'); requestAnimationFrame(() => { b.scrollLeft = x * b.scrollWidth - b.clientWidth/2; b.scrollTop = y * b.scrollHeight - b.clientHeight/2; }); } };
    pv.querySelector('.pvx').onclick = () => { pv.remove(); };
    if (pv.querySelector('.pvp')) { pv.querySelector('.pvp').onclick = () => { i = (i - 1 + list.length) % list.length; zoom = false; draw(); };
      pv.querySelector('.pvnx').onclick = () => { i = (i + 1) % list.length; zoom = false; draw(); }; }
  };
  draw();
}
function bindPhotos(root){
  root.querySelectorAll('[data-ph]').forEach(el => el.onclick = () => openViewer(el.dataset.ph.split('|'), +el.dataset.i));
}

function resizePhoto(file, max=1600){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
    };
    img.onerror = () => rej(new Error('Fotku nelze načíst'));
    img.src = url;
  });
}

/* ====== start ====== */
async function start(){
  if (API_URL.startsWith('VLOZ')) { $('#main').innerHTML = '<div class="empty">V souboru chybí URL webové aplikace (API_URL).</div>'; return; }
  if (!KEY && !FT) { $('#main').innerHTML = '<div class="empty">Otevřete aplikaci přes přístupový odkaz, který jste dostali e-mailem.</div>'; return; }
  try {
    const j = await api('init');
    S.role = j.role; S.vady = j.vady; S.firmy = j.firmy; S.firmaJm = j.firma; S.appUrl = j.appUrl; S.tym = j.tym || [];
  } catch (e) {
    $('#main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return;
  }
  if (S.role === 'admin' && !ls('vn_jmeno')) askName();
  lastSync = Date.now();
  setTimeout(checkUpdate, 3000);
  $('#rfb').onclick = () => refreshData(true);
  renderHeader(); render();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && S.vady.some(v => v.id === h)) openDetail(h);
}

function askName(){
  const n = prompt('Vaše jméno (zobrazí se u zapsaných vad):', ls('vn_jmeno') || '');
  if (n !== null && n.trim()) ls('vn_jmeno', n.trim());
  renderHeader();
}

/* automatické obnovení dat: po návratu do appky, každou minutu a tlačítkem ⟳ */
let lastSync = 0, syncing = false;
function canAutoRefresh(){
  if (!S.role || syncing) return false;
  if ($('#load').style.display === 'flex') return false;          // právě se ukládá
  if ($('#ov').classList.contains('on')) return false;            // otevřený detail / formulář firmy
  if (document.getElementById('pv')) return false;                // prohlížeč fotek
  if (S.tab === 'new') return false;                              // rozepsaná vada
  return true;
}
async function refreshData(manual){
  if (!manual && !canAutoRefresh()) return;
  if (syncing) return;
  syncing = true; const b = $('#rfb'); if (b) b.classList.add('spin');
  try {
    const j = await api('init');
    S.vady = j.vady; S.firmy = j.firmy; S.tym = j.tym || S.tym; lastSync = Date.now();
    checkUpdate();
    if (manual && S.tab === 'new') { toast('Data obnovena'); }
    else if (!$('#ov').classList.contains('on') && S.tab !== 'new') { const y = window.scrollY; render(); window.scrollTo(0, y); if (manual) toast('Data obnovena'); }
  } catch(e){ if (manual) toast(e.message); }
  finally { syncing = false; if (b) b.classList.remove('spin'); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastSync > 15000) refreshData(false); });
setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - lastSync > 55000) refreshData(false); }, 60000);

/* hlídání nové verze appky na GitHubu: stáhne aktuální index.html (obejde mezipaměť) a porovná APP_VERZE */
let updShown = false;
async function checkUpdate(){
  if (updShown || location.protocol === 'file:') return;
  try {
    const r = await fetch(location.href.split('#')[0], {cache:'reload'});
    const t = await r.text();
    const m = t.match(/const APP_VERZE = '([^']+)'/);
    if (m && m[1] !== APP_VERZE) {
      updShown = true;
      const d = document.createElement('button');
      d.type = 'button'; d.className = 'updbar';
      d.textContent = 'Je k dispozici nová verze appky – ťukni pro načtení';
      d.onclick = () => location.reload();
      document.body.prepend(d);
    }
  } catch(_){}
}

/* ====== seznam ====== */
const FILTRY = [
  ['open','Otevřené', isOpen],
  ['late','Po termínu', isLate],
  ['check','K převzetí', v => v.stav==='Vyřešeno'],
  ['closed','Uzavřené', v => v.stav==='Uzavřeno'],
  ['all','Vše', () => true]
];

function renderList(){
  const base = S.vady.filter(v => !S.firma || (S.firma === '__none' ? !v.firma_id : v.firma_id === S.firma));
  const q = S.q.trim().toLowerCase();
  const f = FILTRY.find(x => x[0] === S.filtr)[2];
  let list = base.filter(f).filter(v => !q || [v.id,v.popis,v.objekt,v.podlazi,v.misto,v.profese,firmName(v.firma_id)].join(' ').toLowerCase().includes(q));
  const pr = {A:0,B:1,C:2};
  list.sort((a,b) => (isLate(b)-isLate(a)) || (isOpen(b)-isOpen(a)) || (pr[a.priorita]-pr[b.priorita]) || (a.termin-b.termin));

  const cnt = k => base.filter(FILTRY.find(x=>x[0]===k)[2]).length;
  const LBL = {open:'otevřené', late:'po termínu', check:'k převzetí', closed:'uzavřené', all:'vše'};
  let h = `<div class="stats">${FILTRY.map(([k]) => `<button type="button" class="stat ${S.filtr===k?'on':''}" data-f="${k}" aria-pressed="${S.filtr===k}"><b class="${k==='late'&&cnt(k)?'late':''}">${cnt(k)}</b><span>${LBL[k]}</span></button>`).join('')}</div>`;
  h += `<div class="bar"><input id="q" placeholder="Hledat (popis, místo, ID…)" value="${esc(S.q)}">`;
  if (S.role === 'admin') h += `<select id="ff" style="max-width:45%"><option value="">Všechny firmy</option><option value="__none" ${S.firma==='__none'?'selected':''}>Neurčeno (bez firmy)</option>${S.firmy.map(f=>`<option value="${f.id}" ${S.firma===f.id?'selected':''}>${esc(f.nazev)}</option>`).join('')}</select>`;
  h += `</div>`;
  if (!list.length) h += `<div class="empty">Nic tu není.</div>`;
  h += list.map(card).join('');
  h += `<p class="small" style="text-align:center;margin-top:24px;opacity:.6">verze ${APP_VERZE}</p>`;
  if (S.role === 'admin') h += `<p class="small" style="text-align:center;margin-top:16px"><a href="#" id="csv" style="color:var(--muted)">Export zobrazeného seznamu do CSV</a></p>`;
  $('#main').innerHTML = h;

  $('#main').querySelectorAll('.stat[data-f]').forEach(b => b.onclick = () => { S.filtr = b.dataset.f; renderList(); });
  const qi = $('#q'); qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; renderList(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); };
  if ($('#ff')) $('#ff').onchange = e => { S.firma = e.target.value; renderList(); };
  $('#main').querySelectorAll('.card').forEach(c => c.onclick = () => openDetail(c.dataset.id));
  if ($('#csv')) $('#csv').onclick = e => { e.preventDefault(); exportCsv(list); };
}

function card(v){
  const misto = [v.objekt, v.podlazi, v.misto].filter(Boolean).join(' / ');
  return `<div class="card" data-id="${esc(v.id)}">
    ${v.foto ? `<img class="thumb" loading="lazy" src="${thumb(fotos(v.foto)[0])}" alt="">` : ''}

      <div class="top"><b style="color:var(--text)">${esc(v.id)}</b>

function exportCsv(list){
  const cols = [['ID','id'],['Stav','stav'],['Priorita','priorita'],['Objekt','objekt'],['Podlaží','podlazi'],['Místo','misto'],['Profese','profese'],
    ['Firma',v=>firmName(v.firma_id)],['Popis','popis'],['Termín',v=>fd(v.termin)],['Založeno',v=>fd(v.vytvoreno)],['Zadal','zadal'],
    ['Vyřešeno firmou',v=>fd(v.vyreseno)],['Uzavřeno',v=>fd(v.uzavreno)],['Komentář firmy','komentar_firmy'],['Komentář týmu','komentar_tym']];
  const val = (v,c) => typeof c === 'function' ? c(v) : (v[c] ?? '');
  const lines = [cols.map(c=>c[0]).join(';')].concat(list.map(v => cols.map(([,c]) => '"'+String(val(v,c)).replace(/"/g,'""')+'"').join(';')));
  const blob = new Blob(['\ufeff'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'vady-nedodelky-'+toDateInput(Date.now())+'.csv'; a.click();
}

      if (RP && RP.files.length) busy(true, 'Nahrávám fotky…');
      const photos = RP ? await resizeAll(RP.files) : [];
      const j = await api('resolve', {id:v.id, text:$('#rt').value.trim(), photos});
      upd(j.vada); closeModal(); render(); toast('Označeno jako vyřešené');
    } catch(e){ toast(e.message); btn.disabled = false; } finally { busy(false); }
  };
  if ($('#bClose')) $('#bClose').onclick = () => {
    act.innerHTML = `<label>Komentář k převzetí (nepovinné)</label><textarea id="ct"></textarea>
      <div class="rowb"><button class="btn sec" id="cc">Zpět</button><button class="btn g" id="co">Převzít a uzavřít</button></div>`;
    $('#cc').onclick = () => renderActions(v);
    $('#co').onclick = async () => {
      try { busy(true); const j = await api('close', {id:v.id, text:$('#ct').value.trim()}); upd(j.vada); closeModal(); render(); toast('Uzavřeno'); }
      catch(e){ toast(e.message); } finally { busy(false); }
    };
  };
  if ($('#bRej')) $('#bRej').onclick = () => {
    act.innerHTML = `<label>Proč se vrací (dostane firma e-mailem)</label><textarea id="jt"></textarea>
      <label>Nový termín</label><input type="date" id="jd" value="${plusDays(DNY[v.priorita]||14)}">
      <div class="rowb"><button class="btn sec" id="jc">Zpět</button><button class="btn o" id="jo">Vrátit firmě</button></div>`;
    $('#jc').onclick = () => renderActions(v);
    $('#jo').onclick = async () => {
      const t = $('#jt').value.trim(); if (!t) return toast('Napište důvod');
      try { busy(true); const j = await api('reject', {id:v.id, text:t, termin:fromDateInput($('#jd').value)}); upd(j.vada); closeModal(); render(); toast('Vráceno, firma dostala e-mail'); }
      catch(e){ toast(e.message); } finally { busy(false); }
    };
  };
  if ($('#bEdit')) $('#bEdit').onclick = () => { closeModal(); S.tab = 'new'; S.editId = v.id; renderHeader(); render(); window.scrollTo(0,0); };
}

function upd(v){ const i = S.vady.findIndex(x => x.id === v.id); if (i >= 0) S.vady[i] = v; else S.vady.push(v); }

/* ====== nová vada / úprava ====== */
function renderForm(){
  const e = S.editId ? S.vady.find(v => v.id === S.editId) : null;
  const last = (() => { try { return JSON.parse(ls('vn_last')||'{}'); } catch(_) { return {}; } })();
  const d = e || {objekt:last.objekt||'', podlazi:last.podlazi||'', misto:'', profese:'', firma_id:'', popis:'', priorita:'B'};
  const act = S.firmy.filter(f => f.aktivni || f.id === d.firma_id);
  const L = {o: d.objekt || '', p: d.podlazi || '', px: e ? (e.px||0) : 0, py: e ? (e.py||0) : 0, zoom:false};
  if (L.o && L.o!=='Venku' && !OBJEKTY.includes(L.o)) L.o = '';

  $('#main').innerHTML = `
  <h2 style="margin:4px 0 6px;font-size:18px">${e ? 'Úprava '+esc(e.id) : 'Nová vada / nedodělek'}</h2>
  <div class="small">Stavba: Jordánská 3. etapa</div>
  ${e ? '' : `<div id="fph"></div>`}
  <label>Objekt</label><div class="seg" id="so"></div>
  <div id="spw"><label>Podlaží</label><div class="seg" id="sp"></div></div>
  <div id="plw"></div>
  <label>Upřesnění místa (nepovinné)</label><input id="fm" value="${esc(d.misto)}" placeholder="byt B.2.05, chodba, u vjezdu…">
  <label>Odpovědná firma</label><select id="ff2"><option value="">Bez firmy – pošle se stavbyvedoucímu</option>${[...act].sort((a,b)=>(a.profese||'').localeCompare(b.profese||'','cs')||a.nazev.localeCompare(b.nazev,'cs')).map(f=>`<option value="${f.id}" ${d.firma_id===f.id?'selected':''}>${f.profese?esc(f.profese)+' – ':''}${esc(f.nazev)}${f.email?'':' (bez e-mailu!)'}</option>`).join('')}</select>
  <label>Popis vady *</label><textarea id="fd2" placeholder="Co je špatně a co má firma udělat">${esc(d.popis)}</textarea>
  <label>Priorita</label>
  <div class="prio">${['A','B','C'].map(p=>`<label><input type="radio" name="pr" value="${p}" ${d.priorita===p?'checked':''}><span>${PRIO[p]}</span></label>`).join('')}</div>
  <div id="ahint" class="note" style="border-color:var(--red);display:${d.priorita==='A'?'block':'none'}"><b>Urgentní:</b> firma dostane e-mail hned (kopie tobě). <b>Zavolej jí.</b></div>
  <label>Termín odstranění *</label>
  <div class="prio" id="qt">${[['Zítra',1],['3 dny',3],['Týden',7],['14 dní',14]].map(([t,n])=>`<label data-n="${n}"><span>${t}</span></label>`).join('')}</div>
  <input type="date" id="ft" style="margin-top:6px" value="${e ? toDateInput(e.termin) : plusDays(DNY[d.priorita])}">
  <button class="btn full" id="fs">${e ? 'Uložit změny' : 'Uložit a poslat firmě'}</button>
  ${e ? '<button class="btn sec full" id="fc">Zrušit</button>' : ''}`;

  const drawLoc = () => {
    $('#so').innerHTML = OBJEKTY.map(o => `<button type="button" data-o="${o}" class="${L.o===o?'on':''}">${o}</button>`).join('');
    const fl = PLANY.filter(x => x[0]===L.o).map(x => x[1]);
    $('#spw').style.display = fl.length ? 'block' : 'none';
    $('#sp').innerHTML = fl.map(p => `<button type="button" data-p="${p}" class="${L.p===p?'on':''}">${p.replace('Střecha','Střecha')}</button>`).join('');
    const pl = planOf(L.o, L.p);
    $('#plw').innerHTML = pl ? planHtml(L.o, L.p, L.px, L.py, L.zoom, 'pbx') +
      `<div class="planbar"><span class="small">${L.px ? 'Místo označeno – ťukni jinam pro přesun' : 'Ťukni do výkresu na místo vady'}</span>
       <button type="button" class="btn sec" id="pz" style="padding:8px 12px">${L.zoom?'Zmenšit':'🔍 Zvětšit'}</button>
       ${L.px?'<button type="button" class="btn sec" id="pc" style="padding:8px 12px">Zrušit bod</button>':''}</div>` : '';
    $('#so').querySelectorAll('button').forEach(b => b.onclick = () => { if (L.o !== b.dataset.o) { L.o = b.dataset.o; if (!planOf(L.o, L.p)) L.p = ''; L.px = L.py = 0; } drawLoc(); });
    $('#sp').querySelectorAll('button').forEach(b => b.onclick = () => { if (L.p !== b.dataset.p) { L.p = b.dataset.p; L.px = L.py = 0; } drawLoc(); });
    if ($('#pz')) $('#pz').onclick = () => { const bx = $('#pbx'); const sx = bx.scrollLeft/bx.scrollWidth, sy = bx.scrollTop/bx.scrollHeight; L.zoom = !L.zoom; drawLoc();
      const nb = $('#pbx'); if (L.zoom && L.px) { nb.scrollLeft = L.px*nb.scrollWidth - nb.clientWidth/2; nb.scrollTop = L.py*nb.scrollHeight - nb.clientHeight/2; } };
    if ($('#pc')) $('#pc').onclick = () => { L.px = L.py = 0; drawLoc(); };
    const img = $('#pbx img');
    if (img) img.onclick = ev => { const r = img.getBoundingClientRect();
      L.px = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)); L.py = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
      const bx = $('#pbx'), sl = bx.scrollLeft, st = bx.scrollTop; drawLoc(); const nb = $('#pbx'); nb.scrollLeft = sl; nb.scrollTop = st; };
  };
  drawLoc();

  let termTouched = !!e;
  $('#ft').onchange = () => termTouched = true;
  document.querySelectorAll('#qt label').forEach(l => l.onclick = () => { $('#ft').value = plusDays(+l.dataset.n); termTouched = true; });
  const FP = $('#fph') ? photoPicker($('#fph'), 'Vyfotit vadu') : null;
  document.querySelectorAll('input[name=pr]').forEach(r => r.onchange = () => { if (!termTouched) $('#ft').value = plusDays(DNY[r.value]); $('#ahint').style.display = r.value==='A'?'block':'none'; });
  if ($('#fc')) $('#fc').onclick = () => { S.editId = null; S.tab = 'list'; renderHeader(); render(); };

  $('#fs').onclick = async () => {
    const data = {
      objekt:L.o, podlazi:L.p, plan:planOf(L.o,L.p)?planId(L.o,L.p):'', px:L.px||0, py:L.py||0, misto:$('#fm').value.trim(), firma_id:$('#ff2').value, popis:$('#fd2').value.trim(), priorita:document.querySelector('input[name=pr]:checked').value,
      termin: fromDateInput($('#ft').value)
    };
    if (!data.popis || !data.termin) return toast('Vyplňte popis a termín');
    const btn = $('#fs'); btn.disabled = true;
    try {
      busy(true);
      if (e) {
        const j = await api('editDefect', {id:e.id, data}); upd(j.vada);
        S.editId = null; S.tab = 'list'; renderHeader(); render(); toast('Uloženo');
      } else {
        if (FP && FP.files.length) { busy(true, FP.files.length > 1 ? 'Nahrávám fotky…' : 'Nahrávám fotku…'); data.photos = await resizeAll(FP.files); }
        const j = await api('addDefect', {data}); upd(j.vada);
        ls('vn_last', JSON.stringify({objekt:data.objekt, podlazi:data.podlazi}));
        toast(j.vada.id + (!data.firma_id ? ' uložena – stavbyvedoucí dostal e-mail k přiřazení' : data.priorita==='A' ? ' uložena – firma dostala e-mail, zavolej jí' : ' uložena – firma ji dostane v ranním souhrnu'));
        renderForm(); // prázdný formulář pro další vadu, objekt a podlaží zůstanou
      }
    } catch(err){ toast(err.message); btn.disabled = false; } finally { busy(false); }
  };
}

/* ====== firmy ====== */
function firmLink(f){ return (S.appUrl || (location.origin+location.pathname)) + '?f=' + f.token; }

function teamHtml(){
  return `<div class="firm" style="border-color:var(--blue2)">
    <div class="n">Tým investora</div>
    <div class="m" style="word-break:normal">Na tyto adresy chodí: vady bez firmy, vady k převzetí, kopie urgentních vad a pondělní přehled. Vidí a mění jen tým.</div>
    <div class="seg" style="margin-top:8px">${(S.tym||[]).map(e => `<span class="chip" style="display:inline-flex;gap:6px;align-items:center">${esc(e)}<button type="button" data-rm="${esc(e)}" aria-label="Odebrat ${esc(e)}" style="background:none;border:0;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 2px">×</button></span>`).join('') || '<span class="m">Zatím nikdo.</span>'}</div>
    <div class="bar" style="margin:10px 0 0"><input id="tmIn" type="email" inputmode="email" placeholder="stavbyvedouci@firma.cz" autocomplete="off"><button class="btn" id="tmAdd" style="flex:none;padding:10px 14px">Přidat</button></div>
  </div>`;
}
async function saveTeam(list){
  try { busy(true); const j = await api('saveTeam', {emails:list}); S.tym = j.tym; renderFirms(); toast('Tým uložen'); }
  catch(e){ toast(e.message); } finally { busy(false); }
}
function bindTeam(){
  $('#tmAdd').onclick = () => { const v = $('#tmIn').value.trim(); if (!v) return toast('Napiš e-mail'); saveTeam([...(S.tym||[]), v]); };
  $('#tmIn').onkeydown = e => { if (e.key === 'Enter') $('#tmAdd').click(); };
  $('#main').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const rest = (S.tym||[]).filter(x => x !== b.dataset.rm);
    if (!rest.length) return toast('V týmu musí zůstat aspoň jedna adresa');
    if (b.dataset.armed) saveTeam(rest); else { b.dataset.armed = '1'; b.textContent = 'odebrat?'; b.style.fontSize = '12px'; b.style.color = 'var(--red)'; }
  });
}

function renderFirms(){
  let h = teamHtml() + `<button class="btn full" id="fa" style="margin:4px 0 12px">+ Přidat firmu</button>`;
  if (!S.firmy.length) h += `<div class="empty">Zatím žádné firmy.</div>`;
  h += S.firmy.map(f => {
    const open = S.vady.filter(v => v.firma_id === f.id && isOpen(v)).length;
    const late = S.vady.filter(v => v.firma_id === f.id && isLate(v)).length;
    return `<div class="firm" style="${f.aktivni?'':'opacity:.5'}">
      <div class="n">${esc(f.nazev)} ${f.aktivni?'':'(neaktivní)'}</div>${f.profese?`<div class="m">${esc(f.profese)}</div>`:''}
      <div class="m">${esc(f.email||'⚠ bez e-mailu – nebude dostávat notifikace')}${f.kontakt?' · '+phoneLinks(f.kontakt):''}</div>
      <div class="m" style="margin-top:4px">otevřené: ${open}${late?` · <span class="late">po termínu: ${late}</span>`:''}</div>
      <div class="rowb">
        <button class="btn sec" data-copy="${f.id}">Kopírovat odkaz</button>
        ${f.email?`<a class="btn sec" style="text-align:center;text-decoration:none" href="mailto:${encodeURIComponent(f.email)}?subject=${encodeURIComponent('Přístup k evidenci vad – Jordánská 3. etapa')}&body=${encodeURIComponent('Dobrý den,\n\nzde je odkaz na seznam vad a nedodělků přidělených vaší firmě:\n'+firmLink(f)+'\n\nPo odstranění vadu v odkazu označte jako vyřešenou a přiložte fotku. Upozornění na nové vady a termíny budou chodit na tento e-mail.\n\nDěkuji')}">Poslat odkaz</a>`:''}
        <button class="btn sec" data-print="${f.id}">Tisk seznamu</button>
        <button class="btn sec" data-edit="${f.id}">Upravit</button>
      </div></div>`;
  }).join('');
  $('#main').innerHTML = h;
  bindTeam();
  $('#fa').onclick = () => firmForm(null);
  $('#main').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => firmForm(S.firmy.find(f => f.id === b.dataset.edit)));
  $('#main').querySelectorAll('[data-print]').forEach(b => b.onclick = () => printFirm(S.firmy.find(f => f.id === b.dataset.print)));
  $('#main').querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    const f = S.firmy.find(x => x.id === b.dataset.copy);
    try { await navigator.clipboard.writeText(firmLink(f)); toast('Odkaz zkopírován'); } catch(_) { prompt('Odkaz pro firmu:', firmLink(f)); }
  });
}

function printFirm(f){
  const pr = {A:0,B:1,C:2};
  const list = S.vady.filter(v => v.firma_id === f.id && v.stav !== 'Uzavřeno')
    .sort((a,b) => (isLate(b)-isLate(a)) || (pr[a.priorita]-pr[b.priorita]) || (a.termin-b.termin));
  const rows = list.map(v => `<tr>
    <td><b>${esc(v.id)}</b><br>${esc(v.priorita)}</td>
    <td>${esc(v.popis)}<div class="s">${esc([v.objekt,v.podlazi,v.misto].filter(Boolean).join(' / '))}</div>${v.komentar_tym?`<div class="s">Pozn.: ${esc(v.komentar_tym)}</div>`:''}</td>
    <td class="${isLate(v)?'late':''}">${fd(v.termin)}${isLate(v)?'<br>PO TERMÍNU':''}</td>
    <td>${esc(v.stav)}</td>
    <td>${v.foto?`<img src="${thumb(fotos(v.foto)[0]).replace('w1000','w300')}">${fotos(v.foto).length>1?'<div class="s">+ další '+(fotos(v.foto).length-1)+'</div>':''}`:''}</td>
    <td>${v.plan && planOf(v.objekt,v.podlazi) && v.px ? `<div class="pl"><img src="${new URL(planOf(v.objekt,v.podlazi)[2], location.href).href}"><i style="left:${v.px*100}%;top:${v.py*100}%"></i></div>` : ''}</td></tr>`).join('');
  const w = window.open('', '_blank');
  if (!w) return toast('Prohlížeč zablokoval nové okno');
  w.document.write(`<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>V+N ${esc(f.nazev)}</title><style>
    body{font:12px Arial,sans-serif;margin:20px;color:#111}h1{font-size:16px;margin:0}.h{color:#555;margin:4px 0 12px}
    table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:5px;vertical-align:top;text-align:left}
    th{background:#1E6EB2;color:#fff}.s{color:#555;margin-top:3px}.late{color:#c00;font-weight:bold}img{width:110px}
    tr{page-break-inside:avoid}.pl{position:relative;width:200px}.pl img{width:200px;display:block}.pl i{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#e5484d;border:2px solid #fff;box-shadow:0 0 0 2px #e5484d}</style></head><body>
    <h1>Vady a nedodělky – ${esc(f.nazev)}</h1>
    <div class="h">BD Jordánská III · stav k ${fd(Date.now())} · otevřené a čekající na převzetí: ${list.length}</div>
    ${list.length?`<table><tr><th>Vada</th><th>Popis / místo</th><th>Termín</th><th>Stav</th><th>Foto</th><th>Místo ve výkresu</th></tr>${rows}</table>`:'<p>Žádné otevřené vady.</p>'}
    <script>window.onload=()=>setTimeout(()=>window.print(),600)<\/script></body></html>`);
  w.document.close();
}

function firmForm(f){
  openModal(`<h2><span>${f?'Upravit firmu':'Nová firma'}</span><button class="x" id="cx">×</button></h2>
    <label>Název *</label><input id="xn" value="${esc(f?.nazev||'')}">
    <label>E-mail pro notifikace (více adres oddělte čárkou)</label><input id="xe" type="text" inputmode="email" value="${esc(f?.email||'')}">
    <label for="xp">Profese – vyber ze seznamu nebo napiš vlastní</label><input id="xp" list="dlp" value="${esc(f?.profese||'')}" placeholder="např. Zedníci" autocomplete="off">
    <datalist id="dlp">${[...new Set([...PROFESE, ...S.firmy.map(x=>x.profese).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'cs')).map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <label>Kontaktní osoba / telefon</label><input id="xk" value="${esc(f?.kontakt||'')}">
    ${f?`<label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="xa" style="width:auto" ${f.aktivni?'checked':''}> aktivní</label>
    <label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="xt" style="width:auto"> vygenerovat nový odkaz (starý přestane fungovat)</label>`:''}
    <button class="btn full" id="xs">Uložit</button>`);
  $('#cx').onclick = closeModal;
  $('#xs').onclick = async () => {
    const data = {id:f?.id, nazev:$('#xn').value.trim(), email:$('#xe').value.trim(), kontakt:$('#xk').value.trim(), profese:$('#xp').value.trim(),
      aktivni: f ? $('#xa').checked : true, newToken: f ? $('#xt').checked : false};
    if (!data.nazev) return toast('Zadejte název');
    $('#xs').disabled = true;
    try {
      busy(true); const j = await api('saveFirm', {data});
      const i = S.firmy.findIndex(x => x.id === j.firma.id); if (i >= 0) S.firmy[i] = j.firma; else S.firmy.push(j.firma);
      closeModal(); renderFirms(); toast('Uloženo');
    } catch(e){ toast(e.message); $('#xs').disabled = false; } finally { busy(false); }
  };
}

start();
</script>
</body>
</html>
